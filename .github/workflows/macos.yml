name: Build macOS

# Chạy thủ công: tab Actions -> "Build macOS" -> Run workflow.
# Nếu điền "release_tag" (ví dụ v3.27.5), file .dmg được đính kèm vào Release đó.
on:
    workflow_dispatch:
        inputs:
            release_tag:
                description: "Tag của Release để đính kèm file .dmg (để trống = chỉ lưu artifact)"
                required: false
                default: ""

permissions:
    contents: write

jobs:
    build-macos:
        strategy:
            fail-fast: false
            matrix:
                include:
                    - target: aarch64-apple-darwin
                      label: aarch64
                    - target: x86_64-apple-darwin
                      label: x64
        runs-on: macos-latest
        steps:
            - uses: actions/checkout@v4

            - uses: actions/setup-node@v4
              with:
                  node-version: 20

            - uses: pnpm/action-setup@v4
              with:
                  version: 9

            - uses: dtolnay/rust-toolchain@stable
              with:
                  targets: ${{ matrix.target }}

            - name: Install dependencies
              run: pnpm install --no-frozen-lockfile

            - name: Build
              run: pnpm tauri build --target ${{ matrix.target }} --bundles dmg

            - name: Collect dmg
              id: collect
              run: |
                  VERSION=$(node -p "require('./src-tauri/tauri.conf.json').package.version")
                  mkdir -p out
                  for f in src-tauri/target/${{ matrix.target }}/release/bundle/dmg/*.dmg; do
                      cp "$f" "out/673Trans-${VERSION}-mac-${{ matrix.label }}.dmg"
                  done
                  ls -la out
                  echo "version=$VERSION" >> "$GITHUB_OUTPUT"

            - uses: actions/upload-artifact@v4
              with:
                  name: 673Trans-mac-${{ matrix.label }}
                  path: out/*.dmg

            - name: Attach to release
              if: ${{ github.event.inputs.release_tag != '' }}
              env:
                  GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
              run: gh release upload "${{ github.event.inputs.release_tag }}" out/*.dmg --clobber
